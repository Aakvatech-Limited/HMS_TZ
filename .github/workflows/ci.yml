name: CI

# Server tests are disabled on push/PR: they need a full bench with MariaDB
# and a test site, which is slow and was blocking PRs on unrelated failures.
# Tests are run locally instead with: bench --site <site> run-tests --app hms_tz
# To re-enable CI tests on every PR, uncomment the push/pull_request triggers below.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - version-15-beta
  # pull_request:
  #   branches:
  #     - version-15-beta
  #   types: [opened, synchronize, reopened]

env:
  BRANCH_TO_CLONE: version-15

concurrency:
  # The pull_request trigger is disabled above, so the PR number is not
  # available here. Restore the line below when re-enabling tests on PRs.
  # group: ci-hms_tz-${{ github.event.pull_request.number || github.ref }}
  group: ci-hms_tz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
    name: Server Tests

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: 'root'
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
            ${{ runner.os }}-

      - name: Install
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          BRANCH_TO_CLONE: ${{ env.BRANCH_TO_CLONE }}

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          rm -f sites/test_site/.test_log
          bench --site test_site clear-cache
          bench --site test_site run-tests --app hms_tz --skip-test-records
        env:
          TYPE: server

      - name: Show bench output
        if: ${{ always() }}
        run: |
          cd ~/frappe-bench
          cat bench_start.log || true
          cd logs
          for f in ./*.log*; do
            echo "Printing log: $f";
            cat $f
          done
