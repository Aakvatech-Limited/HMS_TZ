[project]
name = "hms_tz"
authors = [
    { name = "Aakvatech", email = "info@aakvatech.com" }
]
description = "Hms Tz"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pypdf>=3.9.0",
    "requests",
    "python-dateutil",
    "numpy",
    "pandas",
    "pypika",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project.optional-dependencies]
dev = [
    "pre-commit",
]



[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "I",
  "UP",
  "B",
]
ignore = [
    "E101",
    "W191",
  "E501",
  "E402",
  "E741",
    "F401",  # unused imports
    "F403",  # star imports
    "F405",  # names from star imports
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
